name: Linux release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, such as v0.1.0
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: linux-release-${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Check and build
    if: github.event_name == 'workflow_dispatch' || !github.event.deleted
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test and vet
        run: |
          go test -race ./...
          go vet ./...
      - name: Package Linux release
        run: bash scripts/package-linux.sh "$TAG"
      - uses: actions/upload-artifact@v6
        with:
          name: linux-release
          path: dist/
          if-no-files-found: error
          overwrite: true

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: linux-release
          path: dist
      - name: Publish release assets
        working-directory: dist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum -c SHA256SUMS
          options=(--verify-tag --generate-notes)
          if [[ "$TAG" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$TAG" "${options[@]}" ./*.deb ./*.tar.gz SHA256SUMS
